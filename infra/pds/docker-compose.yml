services:
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pds

  pds:
    # 本番 (docker-compose.prod.yml) と同じ版にそろえる (#286)
    image: ghcr.io/bluesky-social/pds:0.4.5037
    restart: unless-stopped
    ports:
      # **ホストの :3000 で公開する** (step3 Phase 2 S2-6)。dev mode の PDS は自分の公開 URL を
      # `http://localhost:<PDS_PORT>` と名乗り、アカウントの DID 文書もそこを指す。OAuth はこの URL に
      # 直接届く必要があるので、ホスト側のポートを揃える (以前の 2583 では OAuth が通らない)
      - "3000:3000"
    volumes:
      - pds-data:/pds
    env_file:
      - .env
    environment:
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_PORT: "3000"
      # 本番 PLC を使用 (sandbox は廃止済み。DID はローカル PDS 専用で使用)
      PDS_DID_PLC_URL: https://plc.directory
      # ローカル開発: Relay (BGS) には接続しない
      PDS_CRAWLERS: ""
      # ローカル開発: HTTP での起動を許可 (HTTPS チェックをスキップ)
      PDS_DEV_MODE: "true"

volumes:
  pds-data:
  caddy-data:
  caddy-config:
