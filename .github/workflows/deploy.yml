name: Deploy to Production

# 本番 (app.conversensus.site) へ出す。`release` へ push すると走る (main を release へ進める)。
# 手順と前提は deepse/requirements/user-test-environment.md の §11。
#
# step3 Phase 2 (PWA) 以降、本番はクライアントの静的配信と PDS だけである。API サーバ
# (`conversensus.service`) は撤去した。配信の設定 (Caddy) もリポジトリの
# infra/caddy/Caddyfile に揃える — COOP/COEP が付いていないと、全員が「この窓では保存
# できません」になる (保存領域の SQLite-WASM が SharedArrayBuffer を要る)。

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        # tag は差し替えられるので commit で固定する (#285)。上げるのは Dependabot の PR で。
        # 上げたら ECDSA のホスト鍵 (VPS_FINGERPRINT) で通ることを確かめる (drone-ssh の版で変わりうる)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # サーバのホスト鍵を固定する (成りすましたサーバへ鍵を渡さない)
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script_stop: true
          script: |
            set -e
            # root ではなく deploy ユーザーで動く。bun は /usr/local/bin に置いてある
            export PATH="/usr/local/bin:$PATH"
            cd /opt/conversensus
            git fetch origin
            git checkout -B release origin/release
            bun install --frozen-lockfile
            # ビルドに失敗したら、配信も設定も触らずに止まる (set -e)
            bun run --cwd src/client build

            # 配信の設定をリポジトリのものにする。検査に通ったものだけを置く。
            # root の権限が要るのはここだけで、deploy に許してあるのはこのスクリプトだけ
            sudo -n /usr/local/sbin/conversensus-install-caddyfile

            # 成果物を入れ替える。古い版のファイルを残さない (--delete)
            rsync -a --delete src/client/dist/ /var/www/conversensus/
            echo "Deploy complete: $(git log --oneline -1) at $(date)"
